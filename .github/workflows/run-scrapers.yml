name: Run Scrapers Every Tuesday

on:
  schedule:
    - cron: "0 22 * * 1"
  workflow_dispatch:

env:
  TZ: Europe/Vilnius

jobs:
  run-scrapers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Chrome and ChromeDriver
        run: |
          # Install Chrome
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
          # Install ChromeDriver from Ubuntu packages (more reliable)
          sudo apt-get install -y chromium-chromedriver
          
          # Create symlink to standard location
          sudo ln -sf /usr/lib/chromium-browser/chromedriver /usr/local/bin/chromedriver || true
          
          # Verify installations
          google-chrome --version
          chromedriver --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run IKI scraper
        id: iki
        continue-on-error: true
        run: |
          echo "Starting IKI scraper..."
          cd scrapping
          python -u iki_scrape_final.py 2>&1 | tee iki.log || true
          STATUS=$?
          cd ..
          echo "status=${STATUS}" >> $GITHUB_OUTPUT
          echo "IKI scraper completed with exit code: $STATUS"

      - name: Run Lidl scraper
        id: lidl
        continue-on-error: true
        run: |
          echo "Starting Lidl scraper..."
          cd scrapping
          python lidlscrape.py 2>&1 | tee lidl.log
          STATUS=$?
          cd ..
          echo "status=${STATUS}" >> $GITHUB_OUTPUT

      - name: Run Rimi scraper
        id: rimi
        continue-on-error: true
        run: |
          echo "Starting Rimi scraper..."
          cd scrapping
          python rimi_scrape_kodas.py 2>&1 | tee rimi.log
          STATUS=$?
          cd ..
          echo "status=${STATUS}" >> $GITHUB_OUTPUT

      - name: Check Python and dependencies
        run: |
          echo "Python version:"
          python --version
          echo ""
          echo "Installed packages:"
          pip list | grep -E "selenium|pandas|beautifulsoup"
          echo ""
          echo "ChromeDriver location:"
          which chromedriver
          chromedriver --version
          echo ""
          echo "Checking scrapping folder:"
          ls -la scrapping/ | head -20

      - name: Upload CSV outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-outputs-${{ github.run_number }}
          path: |
            scrapping/*.csv
            scrapping/*.log
          retention-days: 30

      - name: Commit and push results (if CSV files changed)
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scrapping/*.csv || true
          git diff --staged --quiet || git commit -m "Update scraper data - $(date +'%Y-%m-%d %H:%M:%S')"
          git push || true

      - name: Generate summary
        if: always()
        run: |
          echo "## 📊 Scraper Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scraper | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.iki.outputs.status }}" == "0" ]; then
            echo "| IKI | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| IKI | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.lidl.outputs.status }}" == "0" ]; then
            echo "| Lidl | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Lidl | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.rimi.outputs.status }}" == "0" ]; then
            echo "| Rimi | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Rimi | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
